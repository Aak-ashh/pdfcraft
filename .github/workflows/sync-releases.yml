name: Sync Releases from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Releases and Assets
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          UPSTREAM_REPO: storytold/pdfcraft
        run: |
          # 1. Fetch upstream releases (oldest to newest)
          UPSTREAM_RELEASES=$(gh api "repos/${UPSTREAM_REPO}/releases" | jq 'reverse')

          # 2. Iterate using process substitution to avoid pipe failure / broken pipe
          while IFS= read -r release; do
            TAG=$(echo "${release}" | jq -r '.tag_name')
            NAME=$(echo "${release}" | jq -r '.name // empty')
            BODY=$(echo "${release}" | jq -r '.body // empty')
            PRERELEASE=$(echo "${release}" | jq -r '.prerelease')
            DRAFT=$(echo "${release}" | jq -r '.draft')
            TARGET_COMMIT=$(echo "${release}" | jq -r '.target_commitish')

            [ "${DRAFT}" = "true" ] && continue

            # Check if release already exists in fork
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists in fork. Skipping."
              continue
            fi

            echo "=== Syncing Release: ${TAG} ==="
            rm -rf ./downloads
            mkdir -p ./downloads

            # Download compiled binaries
            echo "${release}" | jq -r '.assets[]?.browser_download_url' | while IFS= read -r url; do
              if [ -n "${url}" ]; then
                wget -q -P ./downloads "${url}" || echo "Warning: Failed to download ${url}"
              fi
            done

            ARGS=()
            [ "${PRERELEASE}" = "true" ] && ARGS+=(--prerelease)
            [ -n "${NAME}" ] && ARGS+=(-t "${NAME}")
            [ -n "${BODY}" ] && ARGS+=(-n "${BODY}")
            [ -n "${TARGET_COMMIT}" ] && ARGS+=(--target "${TARGET_COMMIT}")

            # Check if any files were downloaded
            shopt -s nullglob
            FILES=(./downloads/*)
            shopt -u nullglob

            if [ ${#FILES[@]} -gt 0 ]; then
              gh release create "${TAG}" "${FILES[@]}" "${ARGS[@]}" || echo "Failed or already exists: ${TAG}"
            else
              gh release create "${TAG}" "${ARGS[@]}" || echo "Failed or already exists: ${TAG}"
            fi

            rm -rf ./downloads
          done < <(echo "${UPSTREAM_RELEASES}" | jq -c '.[]')
